<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#060810">
  <meta name="color-scheme" content="dark">
  <title>Post update — Evoxera Admin</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app-home.css">
  <link rel="stylesheet" href="../css/updates.css">
</head>
<body class="ah-body">
  <div class="ah">
    <header class="up-top">
      <a class="up-back" href="/appevoxera" aria-label="Back to the app">&lsaquo;</a>
      <h1 class="up-h1">Post update</h1>
      <span class="ad-who" id="admin-whoami"></span>
      <button type="button" class="up-btn ad-out" id="admin-signout" hidden>Sign out</button>
    </header>

    <!-- Shown when there is no valid admin session. The backend still enforces admin access on every call. -->
    <section class="ad-gate" id="au-gate" hidden>
      <h2>Admin sign-in needed</h2>
      <p>Posting updates is for Evoxera admin agents. Sign in with your agent account to continue.</p>
      <a class="ad-primary" href="/admin-login.html?next=/admin-updates.html">Sign in as admin</a>
    </section>

    <main id="au-main" hidden>
      <h2 class="ad-h">Published</h2>
      <div id="au-list" aria-live="polite"><p class="up-state">Loading&hellip;</p></div>
      <button type="button" class="up-btn up-more" id="au-more" hidden>Load older updates</button>
      <div class="ad-pad"></div>
    </main>
  </div>

  <!-- Composer: a message bar fixed to the bottom, like a chat app -->
  <form class="ad-bar" id="au-form" hidden novalidate>
    <div class="ad-prevs" id="au-previews"></div>
    <div class="ad-row">
      <input type="file" id="au-files" accept="image/jpeg,image/png,image/webp" multiple hidden>
      <button type="button" class="ad-attach" id="au-add" aria-label="Add images"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/></svg></button>
      <textarea class="ad-in" id="au-body" rows="1" maxlength="4000" placeholder="Write an update for everyone…" aria-label="Update text"></textarea>
      <button type="submit" class="ad-send" id="au-send">Post</button>
    </div>
    <div class="ad-meta"><span id="au-count">0 of 4 images</span><span id="au-chars">0 / 4000</span></div>
    <p class="ad-msg" id="au-msg" role="status"></p>
  </form>

  <script type="module" src="../js/admin-updates.js"></script>
</body>
</html>
