<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Contact — EVOS Business Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .form-input { width:100%; background:var(--bg2); border:1px solid var(--border2); border-radius:9px; padding:11px 14px; font-family:var(--font-body); font-size:14px; color:var(--text); outline:none; transition:border-color .2s; }
    .form-input:focus { border-color:var(--blue); }
    .form-input::placeholder { color:var(--text3); }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="/"><div class="nav-logo__icon">EH</div><span class="nav-logo__text">EVOSHUB</span></a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li><li><a href="/services.html">Services</a></li>
      <li><a href="/website-creation.html">Website Creation</a></li>
      <li><a href="/about.html">About</a></li><li><a href="/contact.html" class="active">Contact</a></li>
    </ul>
  </nav>
  <main class="section" style="padding-top:140px;">
    <span class="section-label">Contact</span>
    <h1 class="section-title">Get in touch</h1>
    <p class="section-desc" style="margin-bottom:8px;">Questions about EVOS Data, EVOS GPT, or EVOS Business Hub in general — we're here to help.</p>
    <div class="card" style="max-width:480px;margin-top:32px;">
      <form class="contact-form" onsubmit="return false;">
        <div style="margin-bottom:16px;"><label style="display:block;font-size:12px;color:var(--text2);margin-bottom:7px;">Name</label><input name="name" type="text" class="form-input" placeholder="Your name"></div>
        <div style="margin-bottom:16px;"><label style="display:block;font-size:12px;color:var(--text2);margin-bottom:7px;">Email</label><input name="email" type="email" class="form-input" placeholder="you@example.com"></div>
        <div style="margin-bottom:16px;"><label style="display:block;font-size:12px;color:var(--text2);margin-bottom:7px;">Message</label><textarea name="message" rows="4" class="form-input" style="resize:vertical;"></textarea></div>
        <div style="position:absolute;left:-9999px;top:-9999px;">
          <label for="contact-website">Leave this field empty</label>
          <input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>
        <button class="form-submit btn btn--primary" style="width:100%;">Send Message</button>
      </form>
    </div>
  </main>
  <script src="../js/contact-form.js" type="module"></script>
</body>
</html>
