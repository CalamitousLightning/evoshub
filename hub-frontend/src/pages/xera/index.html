<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#060810"/>
<meta name="description" content="XERA Token (Coin) — wallet and 24-hour mining by EVOXERA TECHNOLOGY"/>
<title>XERA Token (Coin) | EVOXERA TECHNOLOGY</title>
<link href="../../css/xera.css" rel="stylesheet"/>
</head>
<body>
<div class="app">

  <!-- ===== LOGIN ===== -->
  <section class="auth" id="loginView">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 5L19 19M19 5L5 19" stroke="white" stroke-width="2.6" stroke-linecap="round"/></svg>
    </div>
    <h1>Sign in to XERA</h1>
    <p class="sub">Access your wallet and 24-hour mining session.</p>
    <form id="loginForm">
      <div class="field">
        <label for="identifier">Username or email</label>
        <input id="identifier" autocomplete="username" required/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required/>
      </div>
      <button class="btn" type="submit">Sign in</button>
      <p class="auth-error" id="loginError" role="alert"></p>
    </form>
    <p class="auth-foot">Mining is live. Buying, withdrawing and transferring XERA are coming soon.</p>
  </section>

  <!-- ===== WALLET ===== -->
  <div id="walletView" hidden style="display:flex;flex-direction:column;min-height:100vh">
    <header class="topbar">
      <div class="wordmark"><span class="dot"></span>XERA</div>
      <button class="icon-btn" id="logout" aria-label="Sign out">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 17l5-5-5-5M20 12H9M12 4H6a1 1 0 00-1 1v14a1 1 0 001 1h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <div class="scroll">

      <div class="balance-block">
        <div class="label">TOTAL BALANCE</div>
        <div class="amount"><span id="balance">0</span><small>XERA</small></div>
        <span class="status-pill" id="walletStatus"><span class="dot"></span>ACTIVE</span>
      </div>

      <div class="ring-card">
        <div class="ring-wrap">
          <svg viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="54"/>
            <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="54" stroke-dasharray="339.29" stroke-dashoffset="339.29"/>
          </svg>
          <div class="ring-center">
            <div class="time" id="countdown">--:--:--</div>
            <div class="caption" id="ringCaption">Start your 24-hour session</div>
          </div>
        </div>
        <p class="reward-line" id="rewardText"></p>
      </div>

      <div class="section-title">Coming soon</div>
      <div class="chip-row">
        <div class="chip">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Buy</span>
          <span class="soon">SOON</span>
        </div>
        <div class="chip">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Withdraw</span>
          <span class="soon">SOON</span>
        </div>
        <div class="chip">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 10l-4 4 4 4M3 14h13M17 4l4 4-4 4M21 8H8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Transfer</span>
          <span class="soon">SOON</span>
        </div>
      </div>

      <div class="section-title">Activity</div>
      <div id="transactions"></div>

    </div>

    <div class="bottombar">
      <p class="banner-error" id="error"></p>
      <button class="btn" id="miningAction">Start mining</button>
    </div>
  </div>

</div>
<script src="../../js/xera.js" type="module"></script>
</body>
</html>
