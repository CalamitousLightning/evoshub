<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <script>(function(){try{var t=localStorage.getItem("evos-theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
  <meta name="robots" content="noindex, nofollow">
  <title>Agent Sign In — EVOS Business Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .form-input { width:100%; background:var(--bg2); border:1px solid var(--border2); border-radius:9px; padding:11px 14px; font-family:var(--font-body); font-size:14px; color:var(--text); outline:none; transition:border-color .2s; }
    .form-input:focus { border-color:var(--blue); }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:12px; color:var(--text2); margin-bottom:7px; }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="/"><div class="nav-logo__icon">EH</div><span class="nav-logo__text">EVOSHUB</span></a>
    <button class="theme-toggle" data-theme-toggle role="switch" aria-checked="true" aria-label="Toggle dark / light theme">
      <span class="theme-toggle__icon theme-toggle__icon--moon">🌙</span>
      <span class="theme-toggle__icon theme-toggle__icon--sun">☀️</span>
    </button>
  </nav>
  <main class="section" style="padding-top:140px; max-width:420px;">
    <span class="section-label">Agent Access</span>
    <h1 class="section-title" style="font-size:28px;">Sign in</h1>
    <p class="section-desc" style="margin-bottom:28px;">Use your existing EVOXERA agent account.</p>

    <div class="card">
      <form id="admin-login-form" novalidate>
        <div class="field">
          <label for="al-email">Email</label>
          <input id="al-email" type="email" class="form-input" placeholder="you@evoxera.com" required autocomplete="username">
        </div>
        <div class="field">
          <label for="al-password">Password</label>
          <input id="al-password" type="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <p id="al-error" style="display:none;color:#c0392b;font-size:13px;margin-bottom:12px;"></p>
        <button type="submit" class="btn btn--primary" style="width:100%;" id="al-submit">Sign in</button>
      </form>
    </div>
  </main>

  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/admin-login.js"></script>
</body>
</html>
